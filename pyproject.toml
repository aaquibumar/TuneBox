[project]
name = "tunebox"
version = "0.1.0"
description = "Private local music library and playback"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9", "mutagen>=1.47", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
